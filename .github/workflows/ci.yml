name: CI

on:
  push:
  pull_request:
    branches: [main]

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer

jobs:
  vault:
    name: Vault package build + tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Pin Xcode
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "Pinned Xcode missing; falling back to default" >&2
            echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          fi
      - name: Swift version
        run: swift --version
      - name: Build vault products
        run: |
          swift build --package-path app
          BIN_PATH="$(swift build --package-path app --show-bin-path)"
          test -x "$BIN_PATH/firmament-service"
          test -x "$BIN_PATH/firmament-mcp"
          test -x "$BIN_PATH/firmament-app"
      - name: Test vault package
        run: swift test --package-path app
      - name: Verify dependency lock is stable
        run: git diff --exit-code -- app/Package.resolved
